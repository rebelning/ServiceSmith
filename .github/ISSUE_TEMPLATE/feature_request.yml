name: Feature request
description: 建议新的节点、模板、教学场景或产品能力
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请先描述使用场景和问题，而不只是解决方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明交互方式、数据模型或期望生成的内容。
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 功能范围
      options:
        - Node catalog
        - Topology editor
        - Runtime simulation
        - Project generator
        - Learning content
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你目前如何解决这个问题？
  - type: checkboxes
    id: contribution
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意在维护者确认方向后提交 Pull Request。
