  <path d="M57.5 40.5H45.7c-3.7 0-6.2 2-6.2 5 0 3.2 2.5 4.6 6.5 5.1l4.2.5c1.7.2 2.5.8 2.5 1.8 0 1.3-1.1 2.1-3 2.1H38.5" fill="none" stroke="url(#forge)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
