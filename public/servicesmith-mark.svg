      <stop stop-color="#19232F"/>
      <stop offset="1" stop-color="#090D12"/>
    </linearGradient>
    <linearGradient id="forge" x1="25" y1="20" x2="74" y2="77" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB15F"/>
      <stop offset=".48" stop-color="#FF7A45"/>
